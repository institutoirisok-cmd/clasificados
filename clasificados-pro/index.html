<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clasificadosOK</title>

  <!-- Íconos del navegador -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn-icons-png.flaticon.com/512/1041/1041883.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/1041/1041883.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1041/1041883.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFE600">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="clasificadosOK">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0d0e12;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--accent:#FFE600;--text:#f3f4f6;--muted:#9ca3af}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Outfit,sans-serif}
    body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
    header{position:sticky;top:0;z-index:100;background:rgba(18,18,24,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 20px}
    .header{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:1.5rem;font-weight:800;color:#fff;text-decoration:none}
    .logo span{color:var(--accent)}
    .btn{border:none;padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
    .btn-p{background:var(--accent);color:#000}
    .btn-s{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
    .btn-install{background:linear-gradient(135deg,#10b981,#059669);color:#fff;display:none}
    .controls{max-width:1200px;margin:20px auto;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
    .search{flex:1;min-width:200px;position:relative}
    .search input,.filter{width:100%;padding:12px 12px 12px 40px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;color:#fff}
    .search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .filter{padding:12px;cursor:pointer}
    .cats{max-width:1200px;margin:0 auto 20px;padding:0 20px;display:flex;gap:8px;overflow-x:auto}
    .chip{padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.85rem;color:var(--muted);white-space:nowrap}
    .chip.active{background:var(--accent);color:#000;font-weight:600}
    .grid{max-width:1200px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
    .card.vip{border:2px solid var(--accent)}
    .img{height:180px;background:#18181b;position:relative}
    .img img{width:100%;height:100%;object-fit:cover}
    .body{padding:14px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
    .title{font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .price{color:var(--accent);font-weight:800;font-size:1.2rem;margin-bottom:8px}
    .meta{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .modal.active{display:flex}
    .box{background:#16161a;border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px;position:relative}
    .close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;margin-bottom:6px;font-size:.85rem;color:var(--muted)}
    .form-control{width:100%;padding:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:#fff}
    textarea.form-control{min-height:90px}
    .comment-item{background:rgba(255,255,255,.03);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:.85rem}
    .comment-author{font-weight:700;color:var(--accent);font-size:.75rem}
    .install-banner{position:fixed;bottom:20px;left:20px;right:20px;max-width:420px;margin:0 auto;background:rgba(18,18,24,.95);border:2px solid var(--accent);border-radius:16px;padding:16px;display:none;align-items:center;gap:12px;z-index:9999;backdrop-filter:blur(10px)}
    .install-banner img{width:48px;height:48px;border-radius:10px}
    footer{text-align:center;padding:30px;font-size:.8rem;color:var(--muted);margin-top:40px;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <header>
    <div class="header">
      <a href="#" class="logo"><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> clasificados<span>OK</span></a>
      <div>
        <button id="install-btn" class="btn btn-install" onclick="installApp()"><i class="fa-solid fa-download"></i> Instalar App</button>
        <a href="https://wa.link/snq5ah" target="_blank" class="btn btn-p"><i class="fa-solid fa-star"></i> Destacar</a>
        <button class="btn btn-s" id="auth-btn" onclick="openAuth()">Ingresar</button>
        <button class="btn btn-p" onclick="openPublish()">+ Publicar</button>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search" placeholder="¿Qué estás buscando?" onkeyup="render()">
    </div>
    <select class="filter" id="prov" onchange="render()">
      <option value="">Todas las Provincias</option>
      <option value="Buenos Aires">Buenos Aires</option>
      <option value="Ciudad Autónoma de Buenos Aires">CABA</option>
      <option value="Córdoba">Córdoba</option>
      <option value="Santa Fe">Santa Fe</option>
      <option value="Mendoza">Mendoza</option>
      <option value="Tucumán">Tucumán</option>
    </select>
    <button class="btn btn-s" id="btn-mine" onclick="toggleMine()" style="display:none">Mis Avisos</button>
  </div>

  <div class="cats">
    <div class="chip active" onclick="setCat('',this)">Todas</div>
    <div class="chip" onclick="setCat('Vehículos',this)">Vehículos</div>
    <div class="chip" onclick="setCat('Inmuebles',this)">Inmuebles</div>
    <div class="chip" onclick="setCat('Tecnología',this)">Tecnología</div>
    <div class="chip" onclick="setCat('Hogar',this)">Hogar</div>
    <div class="chip" onclick="setCat('Servicios',this)">Servicios</div>
    <div class="chip" onclick="setCat('Empleo',this)">Empleo</div>
    <div class="chip" onclick="setCat('Moda',this)">Moda</div>
  </div>

  <main class="grid" id="grid"></main>

  <!-- Modal Publicar / Editar -->
  <div class="modal" id="modal-pub">
    <div class="box">
      <button class="close" onclick="closeModal('modal-pub')">&times;</button>
      <h2 id="pub-title">Publicar Aviso</h2>
      <form onsubmit="save(event)">
        <div class="form-group"><label>Título</label><input id="f-title" class="form-control" required></div>
        <div class="form-group"><label>Precio</label><input id="f-price" type="number" class="form-control" required></div>
        <div class="form-group"><label>Categoría</label>
          <select id="f-cat" class="form-control">
            <option>Vehículos</option><option>Inmuebles</option><option>Tecnología</option>
            <option>Hogar</option><option>Servicios</option><option>Empleo</option><option>Moda</option><option>Otros</option>
          </select>
        </div>
        <div class="form-group"><label>Provincia</label>
          <select id="f-loc" class="form-control">
            <option>Buenos Aires</option><option>Ciudad Autónoma de Buenos Aires</option><option>Córdoba</option>
            <option>Santa Fe</option><option>Mendoza</option><option>Tucumán</option>
          </select>
        </div>
        <div class="form-group"><label>WhatsApp</label><input id="f-phone" class="form-control" required></div>
        <div class="form-group"><label>Descripción</label><textarea id="f-desc" class="form-control" required></textarea></div>
        <div class="form-group"><label id="img-label">Foto</label><input id="f-img" type="file" accept="image/*" class="form-control"></div>
        <button class="btn btn-p" style="width:100%" id="pub-btn">Publicar</button>
      </form>
    </div>
  </div>

  <!-- Modal Detalle -->
  <div class="modal" id="modal-detail">
    <div class="box">
      <button class="close" onclick="closeModal('modal-detail')">&times;</button>
      <div id="detail"></div>
      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:15px">
        <h4 style="margin-bottom:10px"><i class="fa-solid fa-comments"></i> Preguntas al vendedor</h4>
        <div id="comments"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <input id="comment-input" class="form-control" placeholder="Escribe tu consulta...">
          <button class="btn btn-p" onclick="sendComment()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Auth -->
  <div class="modal" id="modal-auth">
    <div class="box">
      <button class="close" onclick="closeModal('modal-auth')">&times;</button>
      <h2 id="auth-title">Ingresar</h2>
      <form onsubmit="doAuth(event)">
        <div class="form-group"><label>Email</label><input id="a-email" type="email" class="form-control" required></div>
        <div class="form-group"><label>Contraseña</label><input id="a-pass" type="password" class="form-control" required></div>
        <button class="btn btn-p" style="width:100%" id="auth-btn-submit">Ingresar</button>
      </form>
      <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="loginGoogle()">
        <i class="fa-brands fa-google"></i> Continuar con Google
      </button>
      <p style="text-align:center;margin-top:12px;font-size:.85rem;color:var(--muted)">
        <span id="auth-msg">¿No tienes cuenta?</span> <a href="#" onclick="toggleAuth()" style="color:var(--accent)">Regístrate</a>
      </p>
    </div>
  </div>

  <!-- Banner instalar PWA -->
  <div class="install-banner" id="install-banner">
    <img src="https://cdn-icons-png.flaticon.com/512/1041/1041883.png" alt="App">
    <div style="flex:1">
      <strong>Instala clasificadosOK</strong>
      <p style="font-size:.8rem;color:var(--muted);margin:2px 0 0">Añadila a tu pantalla de inicio</p>
    </div>
    <button class="btn btn-p" onclick="installApp()">Instalar</button>
    <i class="fa-solid fa-xmark" style="cursor:pointer;color:var(--muted)" onclick="closeBanner()"></i>
  </div>

  <footer>
    <p>&copy; 2025 clasificadosOK Argentina</p>
  </footer>

<script>
const SUPABASE_URL = 'https://rhozvkoogswzbdkpeimz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJob3p2a29vZ3N3emJka3BlaW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODU0MjIsImV4cCI6MjEwNzY2MTQyMn0.OqvrsEpKnt6cXYVCW851En6lrL5GnQtJu9C5pxQ0CHs';

let sb, data = [], user = null, cat = '', onlyMine = false, editingId = null, activeId = null, isRegister = false;
let deferredPrompt = null;

function getSb(){ if(!sb) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); return sb; }

// PWA Install
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'inline-flex';
  if (!localStorage.getItem('pwa_closed')) {
    setTimeout(() => document.getElementById('install-banner').style.display = 'flex', 2000);
  }
});

async function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
    document.getElementById('install-btn').style.display = 'none';
  } else {
    alert("En iPhone: Tocá Compartir → Agregar a Inicio.\nEn Android: Menú ⋮ → Instalar aplicación.");
  }
}

function closeBanner() {
  document.getElementById('install-banner').style.display = 'none';
  localStorage.setItem('pwa_closed', 'true');
}

async function init(){
  const { data: { session } } = await getSb().auth.getSession();
  user = session?.user || null;
  updateUI();
  getSb().auth.onAuthStateChange((_, s) => { user = s?.user || null; updateUI(); });
  load();
}

function updateUI(){
  const btn = document.getElementById('auth-btn');
  const mine = document.getElementById('btn-mine');
  if(user){
    btn.innerHTML = 'Salir';
    btn.onclick = () => getSb().auth.signOut();
    mine.style.display = 'inline-flex';
  } else {
    btn.innerHTML = 'Ingresar';
    btn.onclick = openAuth;
    mine.style.display = 'none';
    onlyMine = false;
  }
  if(data.length) render();
}

async function load(){
  const { data: rows } = await getSb().from('listings').select('*').order('created_at',{ascending:false});
  data = rows || [];
  render();
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const p = document.getElementById('prov').value;
  const filtered = data.filter(i => 
    (i.title.toLowerCase().includes(q) || i.description.toLowerCase().includes(q)) &&
    (!p || i.location === p) &&
    (!cat || i.category === cat) &&
    (!onlyMine || (user && i.user_id === user.id))
  );
  document.getElementById('grid').innerHTML = filtered.length ? filtered.map(i => {
    const mine = user && i.user_id === user.id;
    return `
      <div class="card ${i.is_featured?'vip':''}">
        <div class="img" onclick="openDetail('${i.id}')" style="cursor:pointer">
          <img src="${i.image_url||'https://via.placeholder.com/400x300?text=Sin+Imagen'}">
        </div>
        <div class="body">
          <div>
            <div class="title" onclick="openDetail('${i.id}')" style="cursor:pointer">${i.title}</div>
            <div class="price">$ ${Number(i.price).toLocaleString('es-AR')}</div>
            <div class="meta"><span>${i.location}</span><span>${i.category}</span></div>
          </div>
          <div style="display:flex;gap:6px">
            <a href="https://wa.me/${i.phone}?text=Hola,%20vi%20tu%20anuncio%20'${encodeURIComponent(i.title)}'" target="_blank" class="btn btn-p" style="flex:1;justify-content:center">Contactar</a>
            ${mine?`<button class="btn btn-s" onclick="openPublish('${i.id}')">Editar</button>
            <button class="btn btn-s" onclick="del('${i.id}')" style="color:#ef4444"><i class="fa-solid fa-trash"></i></button>`:''}
          </div>
        </div>
      </div>`;
  }).join('') : '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">No hay resultados</p>';
}

function setCat(c, el){ cat = c; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render(); }
function toggleMine(){ onlyMine = !onlyMine; render(); }

function openPublish(id=null){
  if(!user){ alert('Debes iniciar sesión'); openAuth(); return; }
  editingId = id;
  const title = document.getElementById('pub-title');
  const btn = document.getElementById('pub-btn');
  const img = document.getElementById('f-img');
  const imgLabel = document.getElementById('img-label');

  if(id){
    const item = data.find(x=>x.id===id);
    if(!item) return;
    title.textContent = 'Editar Aviso';
    btn.textContent = 'Guardar Cambios';
    img.required = false;
    imgLabel.textContent = 'Foto (opcional)';
    document.getElementById('f-title').value = item.title;
    document.getElementById('f-price').value = item.price;
    document.getElementById('f-cat').value = item.category;
    document.getElementById('f-loc').value = item.location;
    document.getElementById('f-phone').value = item.phone;
    document.getElementById('f-desc').value = item.description;
    img.value = '';
  } else {
    title.textContent = 'Publicar Aviso';
    btn.textContent = 'Publicar';
    img.required = true;
    imgLabel.textContent = 'Foto';
    document.getElementById('f-title').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-desc').value = '';
    img.value = '';
  }
  document.getElementById('modal-pub').classList.add('active');
}

async function save(e){
  e.preventDefault();
  const btn = document.getElementById('pub-btn');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  let imgUrl = '';
  const file = document.getElementById('f-img').files[0];
  if(editingId){
    const old = data.find(x=>x.id===editingId);
    imgUrl = old?.image_url || '';
    if(file) imgUrl = await upload(file);
  } else if(file) imgUrl = await upload(file);

  const payload = {
    title: document.getElementById('f-title').value,
    price: +document.getElementById('f-price').value,
    category: document.getElementById('f-cat').value,
    location: document.getElementById('f-loc').value,
    phone: document.getElementById('f-phone').value,
    description: document.getElementById('f-desc').value,
    image_url: imgUrl,
    user_id: user.id
  };

  let err;
  if(editingId){
    ({ error: err } = await getSb().from('listings').update(payload).eq('id', editingId));
  } else {
    payload.is_featured = false;
    ({ error: err } = await getSb().from('listings').insert([payload]));
  }
  if(err) alert(err.message);
  else {
    closeModal('modal-pub');
    editingId = null;
    load();
  }
  btn.disabled = false;
}

async function upload(file){
  const name = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g,'_');
  const { error } = await getSb().storage.from('anuncios').upload(name, file);
  if(!error) return getSb().storage.from('anuncios').getPublicUrl(name).data.publicUrl;
  return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
}

async function del(id){
  if(!confirm('¿Eliminar este aviso?')) return;
  await getSb().from('listings').delete().eq('id', id);
  load();
}

function openDetail(id){
  activeId = id;
  const i = data.find(x=>x.id===id);
  if(!i) return;
  document.getElementById('detail').innerHTML = `
    <img src="${i.image_url||'https://via.placeholder.com/400x300'}" style="width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-bottom:12px">
    <h2>${i.title}</h2>
    <h3 style="color:var(--accent);margin:8px 0">$ ${Number(i.price).toLocaleString('es-AR')}</h3>
    <p style="color:var(--muted);font-size:.9rem">${i.location} | ${i.category}</p>
    <p style="margin:12px 0;white-space:pre-line">${i.description}</p>
    <a href="https://wa.me/${i.phone}?text=Hola,%20vi%20tu%20anuncio%20'${encodeURIComponent(i.title)}'" target="_blank" class="btn btn-p" style="width:100%;justify-content:center">Contactar por WhatsApp</a>
  `;
  loadComments(id);
  document.getElementById('modal-detail').classList.add('active');
}

async function loadComments(id){
  const { data: rows } = await getSb().from('ad_comments').select('*').eq('listing_id', id).order('created_at');
  const box = document.getElementById('comments');
  if(!rows?.length){
    box.innerHTML = '<p style="font-size:.8rem;color:var(--muted)">No hay preguntas aún. ¡Sé el primero!</p>';
    return;
  }
  box.innerHTML = rows.map(c => `<div class="comment-item"><span class="comment-author">${c.sender_name||'Anónimo'}</span><p>${c.message}</p></div>`).join('');
}

async function sendComment(){
  const input = document.getElementById('comment-input');
  const msg = input.value.trim();
  if(!msg || !activeId) return;
  const name = user ? user.email.split('@')[0] : 'Anónimo';
  const { error } = await getSb().from('ad_comments').insert([{ listing_id: activeId, sender_name: name, message: msg }]);
  if(error) alert(error.message);
  else { input.value = ''; loadComments(activeId); }
}

function openAuth(){ document.getElementById('modal-auth').classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function toggleAuth(){
  isRegister = !isRegister;
  document.getElementById('auth-title').textContent = isRegister ? 'Crear Cuenta' : 'Ingresar';
  document.getElementById('auth-btn-submit').textContent = isRegister ? 'Registrarse' : 'Ingresar';
  document.getElementById('auth-msg').textContent = isRegister ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
}
async function doAuth(e){
  e.preventDefault();
  const email = document.getElementById('a-email').value;
  const pass = document.getElementById('a-pass').value;
  const fn = isRegister ? getSb().auth.signUp : getSb().auth.signInWithPassword;
  const { error } = await fn({ email, password: pass });
  if(error) alert(error.message);
  else closeModal('modal-auth');
}

async function loginGoogle() {
  await getSb().auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
}

init();
</script>
</body>
</html>
