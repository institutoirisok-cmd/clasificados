<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasificados Pro | Mercado Local & Chat En Vivo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FFE600" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap');

    :root {
      --bg: #0b091a;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-soft: rgba(255, 255, 255, 0.6);
      --accent: #FFE600;
      --accent-glow: rgba(255, 230, 0, 0.35);
      --shadow-3d: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: linear-gradient(135deg, #0b091a 0%, #120e2e 50%, #1c1545 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Fondo animado 3D */
    .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .blob {
      position: absolute; width: 500px; height: 500px; border-radius: 50%;
      filter: blur(140px); opacity: 0.3; animation: float 18s infinite ease-in-out alternate;
    }
    .blob-1 { background: var(--accent); top: -10%; left: -5%; }
    .blob-2 { background: #8b5cf6; bottom: -10%; right: -5%; animation-delay: -7s; }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, -40px) scale(1.1); }
    }

    main { position: relative; z-index: 1; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      background: rgba(11, 9, 26, 0.7);
      border-bottom: 1px solid var(--surface-border);
      padding: 1rem 5vw;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      font-weight: 300; font-size: 1.5rem; color: var(--text);
      text-decoration: none; display: flex; align-items: center; gap: 0.5rem;
    }
    .logo span { font-weight: 600; color: var(--accent); }

    /* Layout Principal */
    .container {
      max-width: 1280px; margin: 0 auto;
      padding: 2rem 4vw 5rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Cards Estilo Glassmorphism 3D */
    .card-3d {
      background: linear-gradient(165deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 1.8rem;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-3d);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Formulario Publicar */
    h2 { font-weight: 300; font-size: 1.25rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    h2 i { color: var(--accent); }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-soft); margin-bottom: 0.3rem; }
    input, select, textarea {
      width: 100%; padding: 0.8rem 1rem; border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: rgba(255,255,255,0.03); color: var(--text);
      font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); background: rgba(255,255,255,0.06); }

    .btn-accent {
      width: 100%; padding: 0.9rem; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #e6ce00 100%);
      color: #0b091a; font-family: inherit; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; box-shadow: 0 8px 25px var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 12px 32px var(--accent-glow); }

    /* Grid de Anuncios */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; margin-top: 1.5rem; }
    .item-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--surface-border);
      border-radius: 20px; overflow: hidden; backdrop-filter: blur(10px);
      transition: transform 0.3s ease; display: flex; flex-direction: column;
    }
    .item-card:hover { transform: translateY(-6px); }
    .item-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-bottom: 1px solid var(--surface-border); }
    .item-body { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; }
    .price { color: var(--accent); font-weight: 600; font-size: 1.2rem; margin-top: auto; padding-top: 0.5rem; }

    /* ========================================================= */
    /* SECCIÓN CHAT EN VIVO 3D                                  */
    /* ========================================================= */
    .chat-card {
      position: sticky; top: 90px;
      display: flex; flex-direction: column;
      height: 600px; max-height: calc(100vh - 120px);
      background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid var(--surface-border);
      border-radius: 28px; backdrop-filter: blur(24px);
      box-shadow: var(--shadow-3d); overflow: hidden;
    }

    .chat-header {
      padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--surface-border);
      background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center;
    }
    .chat-header h2 { margin: 0; font-size: 1.1rem; }
    .live-indicator {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.75rem; color: #10b981; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .chat-messages {
      flex: 1; padding: 1.2rem; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.8rem;
    }

    .chat-bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 0.75rem 1rem;
      max-width: 90%; word-break: break-word;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .chat-bubble .author {
      font-size: 0.75rem; font-weight: 600; color: var(--accent);
      margin-bottom: 0.2rem; display: flex; justify-content: space-between;
    }
    .chat-bubble .time { color: var(--text-soft); font-weight: 300; font-size: 0.65rem; }
    .chat-bubble .text { font-size: 0.9rem; color: var(--text); font-weight: 300; }

    .chat-footer {
      padding: 1rem; border-top: 1px solid var(--surface-border);
      background: rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 0.6rem;
    }
    .chat-input-group { display: flex; gap: 0.5rem; }
    .chat-input-group input { flex: 1; padding: 0.75rem 0.9rem; font-size: 0.88rem; border-radius: 12px; }
    .chat-input-group button {
      width: auto; padding: 0 1.2rem; border-radius: 12px;
      background: var(--accent); color: #0b091a; border: none; font-weight: 600; cursor: pointer;
    }

    footer { text-align: center; padding: 3rem 1rem; color: rgba(255,255,255,0.2); font-size: 0.85rem; }
  </style>
</head>

<body>
  <div class="ambient">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <header>
    <a href="#" class="logo">
      <i class="fa-solid fa-comments" style="color:var(--accent);"></i> Clasificados <span>Pro</span>
    </a>
    <div class="live-indicator"><div class="dot"></div> En vivo</div>
  </header>

  <main>
    <div class="container">
      <!-- Columna Principal: Publicar y Ver Anuncios -->
      <div>
        <section class="card-3d">
          <h2><i class="fa-solid fa-plus-circle"></i> Publicar Anuncio</h2>
          <form id="formPublicar" onsubmit="publicarAnuncio(event)">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
              <div class="form-group">
                <label>Título</label>
                <input type="text" id="titulo" placeholder="Ej: Vendo Celular" required />
              </div>
              <div class="form-group">
                <label>Precio</label>
                <input type="text" id="precio" placeholder="Ej: $120.000" required />
              </div>
            </div>
            <div class="form-group">
              <label>Descripción</label>
              <textarea id="descripcion" rows="2" placeholder="Detalles del producto o servicio..." required></textarea>
            </div>
            <div class="form-group">
              <label>URL Imagen (Opcional)</label>
              <input type="url" id="imagenUrl" placeholder="https://..." />
            </div>
            <button type="submit" class="btn-accent">Publicar Anuncio</button>
          </form>
        </section>

        <section style="margin-top: 2.5rem;">
          <h2><i class="fa-solid fa-store"></i> Anuncios Recientes</h2>
          <div id="listaAnuncios" class="grid">
            <p style="color:var(--text-soft);">Cargando anuncios...</p>
          </div>
        </section>
      </div>

      <!-- Columna Derecha: Chat en Vivo Global -->
      <aside>
        <div class="chat-card">
          <div class="chat-header">
            <h2><i class="fa-solid fa-comment-dots" style="color:var(--accent);margin-right:0.4rem;"></i> Chat en Vivo</h2>
            <div class="live-indicator"><div class="dot"></div> Realtime</div>
          </div>

          <div id="chatMessages" class="chat-messages">
            <p style="color:var(--text-soft); font-size:0.85rem; text-align:center;">Cargando mensajes en vivo...</p>
          </div>

          <div class="chat-footer">
            <input type="text" id="chatName" placeholder="Tu Apodo / Nombre" style="font-size:0.8rem; padding:0.5rem 0.8rem;" />
            <form onsubmit="enviarMensajeChat(event)" class="chat-input-group">
              <input type="text" id="chatInput" placeholder="Escribe un mensaje..." required autocomplete="off" />
              <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <p>© 2025 Clasificados Pro · Chat en Tiempo Real activado con Supabase</p>
  </footer>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configuración de Supabase integrada
    const SUPABASE_URL = 'https://rhozvkoogswzbdkpeimz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJob3p2a29vZ3N3emJka3BlaW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODU0MjIsImV4cCI6MjEwNzY2MTQyMn0.OqvrsEpKnt6cXYVCW851En6lrL5GnQtJu9C5pxQ0CHs'; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cargar apodo guardado si existe
    document.getElementById('chatName').value = localStorage.getItem('chat_nickname') || '';

    document.addEventListener('DOMContentLoaded', () => {
      cargarAnuncios();
      cargarChatInicial();
      suscribirChatEnVivo();
    });

    // ==========================================
    // LÓGICA DEL CHAT EN TIEMPO REAL
    // ==========================================
    async function cargarChatInicial() {
      const container = document.getElementById('chatMessages');
      const { data, error } = await supabase
        .from('chat_messages')
        .select('*')
        .order('id', { ascending: false })
        .limit(30);

      if (error) {
        container.innerHTML = '<p style="color:#ff6b6b;font-size:0.8rem;">Error al cargar el chat.</p>';
        return;
      }

      container.innerHTML = '';
      if (data.length === 0) {
        container.innerHTML = '<p style="color:var(--text-soft);font-size:0.85rem;text-align:center;">¡Sé el primero en escribir en el chat!</p>';
        return;
      }

      // Renderizar del más antiguo al más nuevo
      data.reverse().forEach(msg => agregarMensajeAlDOM(msg));
      scrollChatAlFinal();
    }

    function suscribirChatEnVivo() {
      supabase
        .channel('public:chat_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
          agregarMensajeAlDOM(payload.new);
          scrollChatAlFinal();
        })
        .subscribe();
    }

    function agregarMensajeAlDOM(msg) {
      const container = document.getElementById('chatMessages');
      const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.innerHTML = `
        <div class="author">
          <span>${msg.sender_name || 'Anónimo'}</span>
          <span class="time">${time}</span>
        </div>
        <div class="text">${escapeHtml(msg.message)}</div>
      `;
      container.appendChild(bubble);
    }

    async function enviarMensajeChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const nameInput = document.getElementById('chatName');
      const mensaje = input.value.trim();
      const nombre = nameInput.value.trim() || 'Visitante';

      if (!mensaje) return;

      localStorage.setItem('chat_nickname', nombre);
      input.value = '';

      const { error } = await supabase.from('chat_messages').insert([
        { sender_name: nombre, message: mensaje }
      ]);

      if (error) console.error('Error enviando mensaje:', error);
    }

    function scrollChatAlFinal() {
      const container = document.getElementById('chatMessages');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================
    // LÓGICA DE ANUNCIOS
    // ==========================================
    async function cargarAnuncios() {
      const container = document.getElementById('listaAnuncios');
      const { data, error } = await supabase.from('listings').select('*').order('id', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--text-soft);">No hay anuncios publicados todavía.</p>';
        return;
      }

      container.innerHTML = '';
      data.forEach(item => {
        const img = item.image_url ? `<img src="${item.image_url}" alt="${item.title}" />` : '';
        container.innerHTML += `
          <div class="item-card">
            ${img}
            <div class="item-body">
              <h3 style="font-weight:400; font-size:1rem;">${item.title}</h3>
              <p style="color:var(--text-soft); font-size:0.85rem; margin-top:0.3rem;">${item.description}</p>
              <div class="price">${item.price}</div>
            </div>
          </div>
        `;
      });
    }

    async function publicarAnuncio(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = 'Publicando...';

      const data = {
        title: document.getElementById('titulo').value,
        price: document.getElementById('precio').value,
        description: document.getElementById('descripcion').value,
        image_url: document.getElementById('imagenUrl').value || null
      };

      const { error } = await supabase.from('listings').insert([data]);

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('¡Anuncio publicado con éxito!');
        e.target.reset();
        cargarAnuncios();
      }
      btn.innerHTML = 'Publicar Anuncio';
    }
  </script>
</body>
</html>
